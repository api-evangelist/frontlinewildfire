aid: frontlinewildfire
name: Frontlinewildfire
description: 'Frontline Wildfire Defense is a wildfire protection company that designs, manufactures,
  and installs exterior sprinkler defense systems for homes, businesses, wineries, summer camps, and
  new-home communities. The system combines roof- and ground-mounted sprinklers, a pump, and water/foam
  concentrate with a mobile app (iOS and Android) that lets property owners remotely activate the system,
  monitor nearby wildfires on a live fire map, and receive evacuation alerts. The company also publishes
  wildfire risk maps, home-hardening and defensible-space guidance, and works through a network of
  partner installers. Backed by Norwest Venture Partners. This is a consumer/hardware company profile;
  no public developer API surface was found during enrichment.'
